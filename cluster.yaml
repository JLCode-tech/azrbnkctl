apiVersion: azrbnkctl/v1
kind: Cluster

metadata:
  name: poc-dual-interface
  subscriptionId: 3923f1da-92d6-4910-921c-7a9b3de99f5a
  location: eastus2
  resourceGroup: f5-bigip-ve-demo-rg

pattern: dual-interface

network:
  vnetCidr: 10.0.0.0/16
  subnets:
    system: 10.0.0.0/20
    public: 10.0.16.0/28
    external: 10.0.17.0/24
    internal: 10.0.18.0/24

cluster:
  kubernetesVersion: "1.34.10"
  systemNodePool:
    name: system
    vmSize: Standard_D4s_v3
    count: 2
  tmmNodePool:
    name: tmm
    vmSize: Standard_D8s_v3
    count: 1
    acceleratedNetworking: true

bnk:
  manifestVersion: "2.4.0"
  deploymentSize: "Small"
  tmmCpu: "2"
  tmmMemory: "4Gi"
  tmmMtu: 1500
  farArchive: "./keys/f5-far-auth-key.tgz"
  jwt: "./keys/license.jwt"

egress:
  enabled: true
  namespace: "egress-demo"
  port: 4789

forge:
  enabled: true
  url: http://localhost:8000
  mcpUrl: http://localhost:8081/mcp/
  credentialTemplateId: 5
  username: admin
  password: admin123

tags:
  Environment: "lab"
  Region: "eastus2"
  Purpose: "azure-local-bnk-validation"
  ManagedBy: "azrbnkctl"
