name: Spellcheck

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  cspell:
    name: cspell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: cspell.json
          files: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md
