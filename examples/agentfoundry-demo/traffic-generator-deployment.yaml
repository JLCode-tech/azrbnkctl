apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-generator-script
  namespace: default
data:
  traffic_gen.py: |
    import json
    import os
    import random
    import time
    import urllib.request
    import urllib.error

    SYMBOLS = ["MSFT", "AAPL", "NVDA", "AMZN", "GOOG", "BHP.AX", "CBA.AX", "TLS.AX"]
    VIP = os.environ.get("BNK_VIP", "10.0.17.100")
    INGRESS_HOST = os.environ.get("INGRESS_HOST", "bnk-ingress.bnk-demo.internal")
    MCP_URL = f"http://{VIP}/v1/mcp/forecast"
    DISC_URL = f"http://{VIP}/.well-known/agent-card.json"
    SHIPPER_URL = os.environ.get("SHIPPER_URL", "http://foundry-token-shipper.llm-egress.svc.cluster.local:9090")
    AGENT_TOKEN = os.environ.get("AGENT_TOKEN", "demo-agent-token-a7f3c1")
    EXTERNAL_TOKEN = os.environ.get("EXTERNAL_TOKEN", "demo-external-token-4b9e2d")

    def post_json(url, data, headers=None, timeout=5):
        h = {"Content-Type": "application/json", "Host": INGRESS_HOST}
        if headers:
            h.update(headers)
        req = urllib.request.Request(
            url,
            data=json.dumps(data).encode("utf-8"),
            headers=h
        )
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status
        except urllib.error.HTTPError as e:
            return e.code
        except Exception as e:
            return 0

    def get(url, headers=None, timeout=5):
        h = {"Host": INGRESS_HOST}
        if headers:
            h.update(headers)
        req = urllib.request.Request(url, headers=h)
        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                return resp.status
        except urllib.error.HTTPError as e:
            return e.code
        except Exception:
            return 0

    print("Starting continuous dual-leg traffic generator (Azure AI Foundry + F5 BNK)...", flush=True)
    while True:
        sym = random.choice(SYMBOLS)
        ptk = random.randint(220, 380)
        ctk = random.randint(140, 290)
        lat = random.randint(280, 590)

        # Leg A: Azure AI Foundry Model reasoning token shipment
        model_rec = {
            "job": "llm-gateway",
            "model": "gpt-4o",
            "status": "200",
            "prompt_tk": ptk,
            "comp_tk": ctk,
            "latency_ms": lat,
            "userq": "Forecast " + sym + " financial metrics for 30 days",
            "caller": "azure-foundry-agent",
            "client": "10.0.17.50",
            "action": "allow",
            "req_body": "{\"prompt\":\"Evaluate quarterly earnings trajectory and risk profile for " + sym + ".\"}",
            "resp_body": "{\"forecast\":\"" + sym + " 30-day projection: steady trajectory, governed by F5 BNK.\"}"
        }
        s_res = post_json(SHIPPER_URL, model_rec, headers={"Host": "foundry-token-shipper.llm-egress.svc.cluster.local"})

        # Leg B1: Trusted forecast (200 OK)
        fc_body = {
            "jsonrpc": "2.0",
            "id": 1,
            "method": "tools/call",
            "params": {"name": "forecast", "arguments": {"symbol": sym, "days": 30}}
        }
        f_res = post_json(
            MCP_URL,
            fc_body,
            {"Authorization": "Bearer " + AGENT_TOKEN}
        )

        # Leg B2: Unauthorized balance (403 Forbidden by BNK policy)
        bal_body = {
            "jsonrpc": "2.0",
            "id": 2,
            "method": "tools/call",
            "params": {"name": "get_account_balance", "arguments": {"account_id": "ACC-1001"}}
        }
        b_res = post_json(
            MCP_URL,
            bal_body,
            {"Authorization": "Bearer " + EXTERNAL_TOKEN}
        )

        # Leg B3: Discovery (200 OK)
        d_res = get(DISC_URL)

        # Leg B4: Unauthenticated (401 Unauthorized)
        u_res = post_json(MCP_URL, fc_body)

        ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        print("[" + ts + "] Wave sent -> Model:" + sym + " (Loki:" + str(s_res) + ", " + str(ptk+ctk) + " tk) | MCP forecast:" + str(f_res) + " bal:" + str(b_res) + " disc:" + str(d_res) + " unauth:" + str(u_res), flush=True)
        time.sleep(15)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundry-traffic-generator
  namespace: default
  labels:
    app: foundry-traffic-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foundry-traffic-generator
  template:
    metadata:
      labels:
        app: foundry-traffic-generator
    spec:
      containers:
      - name: traffic-gen
        image: python:3.11-slim
        command: ["python3", "-u", "/app/traffic_gen.py"]
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 150m
            memory: 128Mi
      volumes:
      - name: code
        configMap:
          name: traffic-generator-script
