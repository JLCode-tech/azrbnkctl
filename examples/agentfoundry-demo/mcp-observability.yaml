# Live observability sink for BNK governance telemetry on Azure AKS.
#
#   BNK TMM  --(iRule: log local0.)-->  f5-fluentbit sidecar stdout
#                                            |
#                          Fluent Bit DaemonSet tails the container log
#                                            |
#                                          Loki  <-- BNK Forge reads
#                                  http://loki.llm-egress:3100
#
# Namespace, service name and port are structured for Forge's LLM Observability
# panel which queries `http://loki.llm-egress:3100` and expects Loki streams labelled
# `job="llm-gateway"` with `model` and `status`.
#
# Apply with:
#   KUBECONFIG=.azrbnkctl/bnk-agentfoundry-demo/kubeconfig \
#     kubectl apply -f mcp-observability.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-egress
  labels:
    app.kubernetes.io/part-of: bnk-agentfoundry-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: llm-egress
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: false
      allow_structured_metadata: false
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:3.0.0
        args:
        - -config.file=/etc/loki/config/config.yaml
        ports:
        - containerPort: 3100
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/loki/config
        - name: data
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: loki
spec:
  ports:
  - port: 3100
    targetPort: 3100
    name: http
  selector:
    app.kubernetes.io/name: loki
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-collector
  namespace: llm-egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-collector
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-collector
subjects:
- kind: ServiceAccount
  name: fluent-bit-collector
  namespace: llm-egress
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: llm-egress
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_f5-tmm-*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  2

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   log BNKGOV

    [FILTER]
        Name    parser
        Match   kube.*
        Key_Name log
        Parser  bnkgov
        Reserve_Data On

    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.llm-egress.svc.cluster.local
        Port        3100
        Labels      job=llm-gateway
        Label_Keys  $model,$status,$action,$caller
        Line_Format json
        Auto_Kubernetes_Labels Off

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

    [PARSER]
        Name        bnkgov
        Format      regex
        Regex       ^.*BNKGOV\s+(?<raw_json>\{.*\})$
        Decode_Field_As json raw_json
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: llm-egress
  labels:
    app.kubernetes.io/name: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
    spec:
      serviceAccountName: fluent-bit-collector
      tolerations:
      - operator: Exists
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.0.4
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc/
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: fluent-bit-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
