# HTTP/2 (h2c) reference for Azure Local / Edge Zones:
# GatewaySettings, backend with appProtocol: kubernetes.io/h2c, Gateway at 10.0.17.123, HTTPRoute.
apiVersion: v1
kind: Namespace
metadata:
  name: http2-scenario
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: http2-scenario
  namespace: http2-scenario
spec:
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs:
      - name: listener-pool
      networkRefs:
      - name: ext-vlan-infra
      sourceNATConfig:
        type: Automap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http2-backend
  namespace: http2-scenario
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http2-backend
  template:
    metadata:
      labels:
        app: http2-backend
    spec:
      containers:
      - name: backend
        image: nghttp2/nghttp2
        command: ["nghttpd", "--no-tls", "-v", "80"]
        ports:
        - containerPort: 80
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: http2-backend
  namespace: http2-scenario
spec:
  selector:
    app: http2-backend
  ports:
  - name: http2
    port: 80
    targetPort: 80
    protocol: TCP
    appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http2-gateway
  namespace: http2-scenario
spec:
  gatewayClassName: poc-dual-interface-gatewayclass
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: http2-scenario
  addresses:
  - type: IPAddress
    value: 10.0.17.123
  listeners:
  - name: http2-listen
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http2-route
  namespace: http2-scenario
spec:
  parentRefs:
  - name: http2-gateway
    sectionName: http2-listen
  rules:
  - backendRefs:
    - name: http2-backend
      port: 80
