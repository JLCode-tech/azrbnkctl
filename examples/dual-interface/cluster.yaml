apiVersion: azrbnkctl/v1
kind: Cluster
metadata:
  name: poc-dual-interface
  subscriptionId: 00000000-0000-0000-0000-000000000000
  location: eastus2
  resourceGroup: azrbnkctl-poc-dual-interface-rg
pattern: dual-interface
network:
  vnetCidr: 10.0.0.0/16
  subnets:
    system: 10.0.0.0/20
    public: 10.0.16.0/28
    external: 10.0.17.0/24
    internal: 10.0.18.0/24
cluster:
  kubernetesVersion: "1.32.0"
  systemNodePool:
    name: system
    vmSize: Standard_D4s_v5
    count: 2
  tmmNodePool:
    name: tmm
    vmSize: Standard_D8s_v5
    count: 1
    acceleratedNetworking: true
bnk:
  manifestVersion: "2.4.0"
  deploymentSize: "small"
  tmmCpu: "2"
  tmmMemory: "4Gi"
  tmmMtu: 1500
  farArchive: "./keys/f5-far-auth-key.tgz"
  jwt: "./keys/license.jwt"
egress:
  enabled: true
  namespace: "bnk-demo"
  port: 4789
tags:
  Environment: "PoC"
  Topology: "dual-interface"
  ManagedBy: "azrbnkctl"
