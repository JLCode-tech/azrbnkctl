apiVersion: v1
kind: Namespace
metadata:
  name: lz-eastus2-demo
---
apiVersion: gateway.k8s.f5.com/v1alpha1
kind: GatewaySettings
metadata:
  name: lz-eastus2-settings
  namespace: lz-eastus2-demo
spec:
  ingressConfig:
    defaultListenerNetwork:
      ipamRefs:
      - name: listener-pool
      networkRefs:
      - name: external
      sourceNATConfig:
        type: Automap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http2-echo
  namespace: lz-eastus2-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http2-echo
  template:
    metadata:
      labels:
        app: http2-echo
    spec:
      containers:
      - name: echo
        image: nghttp2/nghttp2
        command: ["nghttpd", "--no-tls", "-v", "80"]
        ports:
        - containerPort: 80
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: http2-echo
  namespace: lz-eastus2-demo
spec:
  selector:
    app: http2-echo
  ports:
  - name: http2
    port: 80
    targetPort: 80
    protocol: TCP
    appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lz-eastus2-gw
  namespace: lz-eastus2-demo
spec:
  gatewayClassName: local-zone-eastus2-gatewayclass
  infrastructure:
    parametersRef:
      group: gateway.k8s.f5.com
      kind: GatewaySettings
      name: lz-eastus2-settings
  addresses:
  - type: IPAddress
    value: 10.0.17.100
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lz-eastus2-route
  namespace: lz-eastus2-demo
spec:
  parentRefs:
  - name: lz-eastus2-gw
    sectionName: http
  rules:
  - backendRefs:
    - name: http2-echo
      port: 80
